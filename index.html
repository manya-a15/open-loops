<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Loops Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a mail client shell (sidebar + one main pane) with Open Loops woven in: morning brief, inbox pills, a capture chip, and a tray. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #1B2230;
  --muted: #5D6777;
  --line: #E0E4EB;
  --brand: #2C4A7E;
  --brand-soft: #E6ECF6;
  --loop: #B4650A;
  --loop-soft: #FCEFDD;
  --ok: #2B7A4D;
  --ok-soft: #E3F2E9;
  --shadow: 0 8px 28px rgba(27, 34, 48, .14);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141A; --surface: #191E27; --ink: #E6E9EF; --muted: #9AA3B3; --line: #2A3140;
    --brand: #93B2E6; --brand-soft: #1F2A3D; --loop: #F2A54A; --loop-soft: #36260F;
    --ok: #6EC593; --ok-soft: #15301F; --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141A; --surface: #191E27; --ink: #E6E9EF; --muted: #9AA3B3; --line: #2A3140;
  --brand: #93B2E6; --brand-soft: #1F2A3D; --loop: #F2A54A; --loop-soft: #36260F;
  --ok: #6EC593; --ok-soft: #15301F; --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 120px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.shell { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.wordmark { display: flex; align-items: baseline; gap: 10px; }
.wordmark h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; margin: 0; letter-spacing: -.01em; }
.wordmark span { font-family: var(--f-mono); font-size: .72rem; color: var(--loop); background: var(--loop-soft); padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .06em; }
.today { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.demo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: .85rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; }
.demo strong { color: var(--ink); font-weight: 600; }
.demo button { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: .8rem; }

/* App grid */
.app { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; }
nav.side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.navbtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 99px; padding: 8px 14px; font-weight: 500; }
.navbtn:hover { background: var(--brand-soft); }
.navbtn[aria-current="true"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.count { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.count.loop { color: var(--surface); background: var(--loop); border-radius: 99px; padding: 0 8px; font-weight: 500; }
main { min-width: 0; display: flex; flex-direction: column; gap: 12px; }

/* Morning brief */
.brief { background: var(--loop-soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brief.clear { background: var(--ok-soft); }
.brief .ring { width: 38px; height: 38px; flex: none; }
.brief .txt { flex: 1 1 260px; min-width: 0; }
.brief h2 { font-family: var(--f-display); font-size: 1.1rem; margin: 0; font-weight: 700; text-wrap: balance; }
.brief p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-weight: 500; font-size: .88rem; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--surface); }
.btn.loopy { background: var(--loop); border-color: var(--loop); color: var(--surface); }

/* Inbox list */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--bg); }
.row .from, .row .subj { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .subj { color: var(--muted); }
.row .subj b { color: var(--ink); font-weight: 500; }
.row.unread .from, .row.unread .subj b { font-weight: 700; }
.row .meta { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.time { font-family: var(--f-mono); font-size: .76rem; color: var(--muted); white-space: nowrap; }
.pill { font-family: var(--f-mono); font-size: .72rem; border-radius: 99px; padding: 2px 8px; white-space: nowrap; }
.pill.loop { background: var(--loop-soft); color: var(--loop); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pillcell { grid-column: 2 / 4; }
.pillcell:empty { display: none; }

/* Email view */
.reader { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.mail { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.back { align-self: flex-start; background: none; border: 0; padding: 4px 0; color: var(--brand); font-weight: 600; }
.mail h2 { font-family: var(--f-display); font-size: 1.4rem; margin: 0; line-height: 1.25; text-wrap: balance; }
.sender { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; color: var(--muted); font-size: .9rem; }
.sender b { color: var(--ink); }
.body { max-width: 65ch; }
.body p { margin: 0 0 10px; }
.body a { color: var(--brand); font-weight: 500; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.loopbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--loop-soft); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: .88rem; }
.loopbar.ok { background: var(--ok-soft); }
.loopbar .btn { margin-left: auto; padding: 3px 10px; font-size: .8rem; }
.reply { display: flex; flex-direction: column; gap: 8px; }
.reply textarea { width: 100%; min-height: 84px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; }

/* "What Open Loops noticed" panel */
.notice { padding: 16px; display: flex; flex-direction: column; gap: 10px; font-size: .88rem; }
.notice h3 { margin: 0; font-family: var(--f-display); font-size: 1rem; }
.notice .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips code { font-family: var(--f-mono); font-size: .78rem; background: var(--brand-soft); color: var(--brand); border-radius: 6px; padding: 1px 6px; }
.score { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.meter { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--loop); }
.verdict { border-radius: 10px; padding: 8px 10px; font-weight: 600; }
.verdict.yes { background: var(--loop-soft); color: var(--loop); }
.verdict.no { background: var(--bg); color: var(--muted); }
.formula { color: var(--muted); font-size: .8rem; border-top: 1px solid var(--line); padding-top: 8px; }

/* Open Loops tray */
.trayhead h2 { font-family: var(--f-display); font-size: 1.4rem; margin: 0; }
.trayhead p { margin: 2px 0 0; color: var(--muted); max-width: 65ch; }
.loops { display: flex; flex-direction: column; gap: 10px; }
.loopcard { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--loop); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; }
.loopcard.closed { border-left-color: var(--ok); opacity: .85; }
.loopcard h3 { margin: 0; font-size: 1rem; font-weight: 600; }
.loopcard .sub { color: var(--muted); font-size: .85rem; }
.due { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.due b { display: block; font-size: 1.15rem; color: var(--loop); font-weight: 500; }
.due span { font-size: .75rem; color: var(--muted); }
.loopcard.closed .due b { color: var(--ok); }
.lc-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lc-actions label { font-size: .8rem; color: var(--muted); }
.lc-actions select { font: inherit; font-size: .85rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.subhead { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 8px 0 0; }

/* Capture chip, toast, reminder preview */
.chip { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--loop); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; z-index: 20; }
.chip .q { font-weight: 600; }
.chip .hint { color: var(--muted); font-size: .85rem; }
.chip .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.chip .x { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted); font-size: 1.2rem; line-height: 1; padding: 4px; }
.timer { height: 3px; background: var(--line); border-radius: 99px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--loop); width: 100%; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 99px; font-size: .9rem; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
.push { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(420px, calc(100% - 32px)); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 12px 14px; z-index: 40; display: flex; flex-direction: column; gap: 6px; }
.pill.prog { background: var(--brand-soft); color: var(--brand); }
.loopcard.prog { border-left-color: var(--brand); }
.loopcard.prog .due b { color: var(--brand); }
.loopbar.prog { background: var(--brand-soft); }
.alert { font-size: .8rem; color: var(--muted); }
.alert b { color: var(--ink); font-weight: 600; }
.push .src { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--loop); font-weight: 600; display: block; }
.push .t { font-weight: 600; }
.push .d { font-size: .88rem; color: var(--muted); }
.push .opts { display: flex; gap: 8px; margin-top: 4px; }
@media (prefers-reduced-motion: no-preference) {
  .chip, .push { animation: rise .28s ease-out; }
  .timer i { transition: width linear; }
}
@keyframes rise { from { opacity: 0; translate: 0 10px; } to { opacity: 1; translate: 0 0; } }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav.side { flex-direction: row; position: static; overflow-x: auto; }
  .navbtn { width: auto; white-space: nowrap; }
  .reader { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .subj { grid-column: 1 / -1; grid-row: 2; }
  .pillcell { grid-column: 1 / -1; }
}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="wordmark"><h1>Mail</h1><span>Open Loops concept</span></div>
    <div class="today" id="today"></div>
  </header>
  <div class="demo">
    <span><strong>Try this:</strong> open the WIEEE email and click the form link, then go back. In Open Loops, press “Simulate confirmation email” to watch it close.</span>
    <button type="button" id="reset">Reset demo</button>
  </div>
  <div class="app">
    <nav class="side" id="nav" aria-label="Folders"></nav>
    <main id="main"></main>
  </div>
</div>
<div class="chip" id="chip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="push" id="push" hidden></div>

<script>
// ---------------------------------------------------------------
// 1. THE DETECTOR (same logic as detector.py, written in JavaScript)
// ---------------------------------------------------------------
const ACTION_WORDS = ["register", "submit", "fill", "form", "deadline", "last date", "due", "pay", "fee",
  "apply", "rsvp", "confirm", "upload", "before", "by tomorrow", "mandatory", "required"];
const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];

function findActionWords(text) {
  text = text.toLowerCase();
  const found = [];
  for (const word of ACTION_WORDS) { if (text.includes(word)) found.push(word); }
  return found;
}
function findDeadline(text) {
  const words = text.toLowerCase().replace(/[,.]/g, " ").split(/\s+/);
  const isNum = s => /^\d+$/.test(s);
  for (let i = 0; i < words.length; i++) {
    for (let m = 0; m < MONTHS.length; m++) {
      if (words[i].startsWith(MONTHS[m])) {
        if (i > 0 && isNum(words[i - 1])) return new Date(2026, m, +words[i - 1]);
        const next = (words[i + 1] || "").replace(/[thndrs]+$/, "");
        if (isNum(next)) return new Date(2026, m, +next);
      }
    }
  }
  return null;
}
const hasLink = text => text.toLowerCase().includes("http") || text.toLowerCase().includes("forms.gle");
function checkEmail(email) {
  const full = email.subject + " " + email.body.replace(/<[^>]+>/g, " ");
  const actions = findActionWords(full);
  const deadline = findDeadline(full);
  const link = hasLink(full);
  let score = actions.length;
  if (deadline) score += 2;
  if (link) score += 1;
  return { isLoop: score >= 3, actions, deadline, link, score };
}

// ---------------------------------------------------------------
// 2. DATES AND REMINDERS
// ---------------------------------------------------------------
const TODAY = new Date(2026, 9, 19); // the demo pretends today is Mon 19 Oct 2026
const DAY = 86400000;
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const daysLeft = d => Math.round((d - TODAY) / DAY);
const fmtDate = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const fmtDay = d => d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const REMIND_OPTIONS = { before2: "2 days before deadline", dayof: "Morning of deadline", tonight: "Tonight", tomorrow: "Tomorrow morning" };

function suggestKey(deadline) { return deadline && daysLeft(deadline) >= 3 ? "before2" : "tonight"; }
function reminderLabel(key, deadline) {
  if (key === "before2" && deadline && daysLeft(deadline) >= 3) return fmtDay(addDays(deadline, -2)) + ", 9:00 AM";
  if (key === "dayof" && deadline) return fmtDay(deadline) + ", 8:00 AM";
  if (key === "tomorrow") return fmtDay(addDays(TODAY, 1)) + ", 8:00 AM";
  return "Tonight, 8:00 PM";
}
// Quiet mode = the user ignored the capture card: no push, except one alert the day before the deadline.
function quietLabel(deadline) {
  return deadline && daysLeft(deadline) >= 2 ? fmtDay(addDays(deadline, -1)) + ", 9:00 AM" : "Tonight, 8:00 PM";
}
function alertHTML(e) {
  const d = e.det.deadline;
  if (e.loop.mode === "loud") return `<span class="alert"><b>Push alert</b> ${reminderLabel(e.loop.key, d)}</span>`;
  return `<span class="alert"><b>Quiet</b> · morning card only, one alert ${quietLabel(d)}</span>`;
}
function dueText(deadline) {
  if (!deadline) return "No date found";
  const n = daysLeft(deadline);
  return n < 0 ? "Overdue" : n === 0 ? "Due today" : n === 1 ? "Due tomorrow" : n + " days left";
}

// ---------------------------------------------------------------
// 3. SAMPLE INBOX (each action email knows what its confirmation email looks like)
// ---------------------------------------------------------------
const SAMPLE = [
  { id: 1, from: "Hostel Office", time: "9:12 AM", read: false, subject: "Hostel fee payment – last date 24 Oct",
    body: "<p>Dear students,</p><p>Please pay the hostel fee for the winter semester on the student portal before 24 October. Late payment will attract a fine.</p><p>Pay here: <a href='#' data-act='link'>https://portal.example.edu/hostel/pay</a></p><p>Regards,<br>Chief Warden's Office</p>",
    confirm: { from: "Student Portal", subject: "Receipt: hostel payment successful", body: "<p>We have received your hostel payment for the winter semester. Keep this receipt for your records.</p>" } },
  { id: 2, from: "WIEEE Club", time: "8:40 AM", read: false, subject: "WIEEE '26 registrations are open!",
    body: "<p>Hey coders!</p><p>Our 24-hour hackathon is back. Register your team of 2–4 at <a href='#' data-act='link'>forms.gle/wieee26</a>. Registrations close on Oct 28th.</p><p>It's mandatory for every team member to fill in their own details.</p><p>See you there,<br>Team WIEEE</p>",
    confirm: { from: "Google Forms", subject: "Your response to WIEEE '26 has been recorded", body: "<p>Thanks! Your response has been recorded. A copy of your answers is below.</p>" } },
  { id: 3, from: "Prof. R. Iyer", time: "Yesterday", read: false, subject: "CSE1001 – Lab assignment 3",
    body: "<p>Dear class,</p><p>Submit Lab Assignment 3 on the course page by 22 Oct, 11:59 PM. Upload a single PDF with your code and screenshots of the output.</p><p>Link: <a href='#' data-act='link'>https://lms.example.edu/cse1001/lab3</a></p><p>– R. Iyer</p>",
    confirm: { from: "Course Page", subject: "Lab assignment 3 received", body: "<p>Your work for Lab Assignment 3 was received. You can view it on the course page.</p>" } },
  { id: 4, from: "Dance Club", time: "Yesterday", read: false, subject: "Auditions this week – RSVP by 21 Oct",
    body: "<p>Hi everyone,</p><p>Auditions for the dance crew are on Friday at the open-air theatre. Please RSVP and confirm your slot by 21 Oct using <a href='#' data-act='link'>forms.gle/dancecrew26</a>.</p><p>Bring water and comfortable shoes!</p>",
    confirm: { from: "Google Forms", subject: "Your response to Dance crew auditions has been recorded", body: "<p>Thanks! Your response has been recorded.</p>" } },
  { id: 5, from: "Ananya", time: "Yesterday", read: true, subject: "physics notes from today",
    body: "<p>Hey! Sharing my physics notes from today's class. Pages 4 to 9 are the important ones.</p><p>See you tomorrow at the lab :)</p>" },
  { id: 6, from: "Scholarship Cell", time: "16 Oct", read: true, subject: "Document verification – upload by 30 Oct",
    body: "<p>Dear scholar,</p><p>Upload your Class 12 marksheet and photo ID for document verification on the scholarship portal by 30 Oct. This step is mandatory to continue receiving the scholarship.</p><p>Portal: <a href='#' data-act='link'>https://portal.example.edu/scholarship</a></p>",
    confirm: { from: "Scholarship Cell", subject: "Documents received for verification", body: "<p>We have received your documents. Verification takes about a week.</p>" },
    loop: { status: "open", key: "before2", mode: "loud", openedOn: "16 Oct", ignored: 0 } },
  { id: 7, from: "Freshers' Committee", time: "15 Oct", read: true, subject: "Photos from Freshers' Night",
    body: "<p>Thanks for coming to Freshers' Night! It was a great evening. The full photo album is up on the committee's page.</p><p>Tag your friends and share the memories.</p>" },
  { id: 8, from: "Campus Weekly", time: "14 Oct", read: true, subject: "This week on campus",
    body: "<p>Here's what happened this week: the robotics club won at TechFest, the new food court near the main gate opened, and the music club's open mic was packed.</p><p>Have a great weekend!</p>" },
];
let emails, view, chipTimer, toastTimer, nextId;
function reset() {
  emails = SAMPLE.map(e => ({ ...e, loop: e.loop ? { ...e.loop } : null, archived: false }));
  emails.forEach(e => { e.det = checkEmail(e); });
  nextId = 100;
  view = { name: "inbox" };
  hideChip(); hidePush();
  render();
}
const byId = id => emails.find(e => e.id === id);
const isActive = e => e.loop && e.loop.status !== "closed";
const far = addDays(TODAY, 999);
// Ignored reminders jump to the top; after that, closest deadline first.
const openLoops = () => emails.filter(isActive)
  .sort((a, b) => (b.loop.ignored - a.loop.ignored) || ((a.det.deadline || far) - (b.det.deadline || far)));
const closedLoops = () => emails.filter(e => e.loop && e.loop.status === "closed");
const newLoop = e => ({ status: "open", key: suggestKey(e.det.deadline), mode: "quiet", openedOn: fmtDate(TODAY), ignored: 0 });

// ---------------------------------------------------------------
// 4. SCREENS
// ---------------------------------------------------------------
const $ = id => document.getElementById(id);
function render() {
  const unread = emails.filter(e => !e.read && !e.archived).length;
  const nLoops = openLoops().length;
  const tab = view.name === "email" ? view.from : view.name;
  $("nav").innerHTML = `
    <button class="navbtn" type="button" data-go="inbox" aria-current="${tab === "inbox"}">Inbox <span class="count">${unread || ""}</span></button>
    <button class="navbtn" type="button" data-go="loops" aria-current="${tab === "loops"}">Open Loops <span class="count ${nLoops ? "loop" : ""}">${nLoops}</span></button>`;
  $("main").innerHTML = view.name === "inbox" ? inboxHTML() : view.name === "loops" ? loopsHTML() : emailHTML(byId(view.id));
  window.scrollTo({ top: 0 });
}

function briefHTML() {
  const loops = openLoops();
  if (!loops.length) return `<section class="brief clear"><div class="txt"><h2>All clear</h2><p>Nothing you opened is waiting on you.</p></div></section>`;
  const top = loops[0];
  let topTxt = top.det.deadline ? `Closest: <b>${top.subject}</b>, due ${fmtDate(top.det.deadline)}.` : `Oldest: <b>${top.subject}</b>.`;
  if (top.loop.ignored) topTxt = `You skipped a reminder for <b>${top.subject}</b>${top.det.deadline ? ", due " + fmtDate(top.det.deadline) : ""}.`;
  return `<section class="brief">
    <svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="var(--loop)" stroke-width="4" stroke-dasharray="70 30" stroke-linecap="round" transform="rotate(-90 20 20)"/><text x="20" y="25" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="var(--loop)">${loops.length}</text></svg>
    <div class="txt"><h2>Good morning. You have ${loops.length} open loop${loops.length > 1 ? "s" : ""}.</h2><p>${topTxt}</p></div>
    <button class="btn loopy" type="button" data-go="loops">See open loops</button></section>`;
}
function pillFor(e) {
  const due = e.det.deadline ? "due " + fmtDate(e.det.deadline) : "no date";
  if (!e.loop) return e.confirmFor ? `<span class="pill ok">Confirmation</span>` : "";
  if (e.loop.status === "open") return `<span class="pill loop">Open loop · ${due}</span>`;
  if (e.loop.status === "progress") return `<span class="pill prog">In progress · ${due}</span>`;
  return `<span class="pill ok">Done</span>`;
}
function inboxHTML() {
  const rows = emails.filter(e => !e.archived).map(e => {
    const snippet = e.body.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 90);
    return `<li class="row ${e.read ? "" : "unread"}" data-open="${e.id}" tabindex="0">
      <span class="from">${e.from}</span>
      <span class="subj"><b>${e.subject}</b> – ${snippet}</span>
      <span class="meta"><span class="time">${e.time}</span></span>
      <span class="pillcell">${pillFor(e)}</span></li>`;
  }).join("");
  return briefHTML() + `<div class="panel"><ul class="list">${rows}</ul></div>`;
}

function noticeHTML(e) {
  if (e.confirmFor) {
    const orig = byId(e.confirmFor);
    return `<aside class="panel notice" aria-label="What Open Loops noticed"><h3>What Open Loops noticed</h3>
      <div class="verdict yes" style="background:var(--ok-soft);color:var(--ok)">Confirmation email</div>
      <div>This came from the place the action happened, so Open Loops closed <b>${orig.subject}</b>.</div>
      <div class="formula">A loop only closes for good when proof like this arrives, or when you say you're done.</div></aside>`;
  }
  const det = e.det;
  const pct = Math.min(100, det.score / 8 * 100);
  return `<aside class="panel notice" aria-label="What Open Loops noticed">
    <h3>What Open Loops noticed</h3>
    <div><div class="lbl">Action words</div><div class="chips">${det.actions.length ? det.actions.map(a => `<code>${a}</code>`).join("") : "<span>None</span>"}</div></div>
    <div><div class="lbl">Deadline</div>${det.deadline ? `${fmtDate(det.deadline)} · ${dueText(det.deadline).toLowerCase()}` : "None found"}</div>
    <div><div class="lbl">Form or payment link</div>${det.link ? "Yes" : "No"}</div>
    <div><div class="lbl">Score</div><span class="score">${det.score} / needs 3</span><div class="meter"><i style="width:${pct}%"></i></div></div>
    <div class="verdict ${det.isLoop ? "yes" : "no"}">${det.isLoop ? "Needs action → open loop" : "Just information → no reminder"}</div>
    <div class="formula">Score = 1 per action word + 2 for a deadline + 1 for a link.</div></aside>`;
}
function emailHTML(e) {
  let bar = "";
  if (e.loop && e.loop.status === "open") bar = `<div class="loopbar"><span><b>Open loop</b> · ${dueText(e.det.deadline)} · ${alertHTML(e)}</span><button class="btn" type="button" data-done="${e.id}">Mark done</button></div>`;
  if (e.loop && e.loop.status === "progress") bar = `<div class="loopbar prog"><span><b>In progress</b> · you opened the link on ${e.loop.linkOn}, waiting for a confirmation email</span><button class="btn" type="button" data-done="${e.id}">I finished it</button></div>`;
  if (e.loop && e.loop.status === "closed") bar = `<div class="loopbar ok"><span><b>Loop closed</b> · ${e.loop.reason}</span></div>`;
  return `<div class="reader">
    <article class="panel mail">
      <button class="back" type="button" data-back>← Back to ${view.from === "loops" ? "Open Loops" : "inbox"}</button>
      ${bar}
      <h2>${e.subject}</h2>
      <div class="sender"><span><b>${e.from}</b> to me</span><span class="time">${e.time}</span></div>
      <div class="body">${e.body}</div>
      <div class="actions">
        <button class="btn" type="button" data-reply>Reply</button>
        <button class="btn" type="button" data-archive="${e.id}">Archive</button>
      </div>
      <div class="reply" id="replybox" hidden>
        <label for="replytext" class="lbl">Reply</label>
        <textarea id="replytext">Hi, thanks for the update. Noted!</textarea>
        <div class="actions"><button class="btn primary" type="button" data-send="${e.id}">Send</button></div>
      </div>
    </article>
    ${noticeHTML(e)}
  </div>`;
}

function loopCardHTML(e) {
  const st = e.loop.status, d = e.det.deadline;
  const opts = Object.entries(REMIND_OPTIONS).filter(([k]) => d || (k !== "before2" && k !== "dayof"))
    .map(([k, v]) => `<option value="${k}" ${e.loop.mode === "loud" && k === e.loop.key ? "selected" : ""}>${v}</option>`).join("");
  const sub = st === "closed" ? `opened ${e.loop.openedOn}`
    : st === "progress" ? `link opened ${e.loop.linkOn} · waiting for a confirmation email`
    : `opened ${e.loop.openedOn} · not acted on yet${e.loop.ignored ? " · reminder skipped" : ""}`;
  let actions;
  if (st === "closed") actions = `<span class="pill ok">${e.loop.reason}</span>`;
  else actions = `
    <label for="rem-${e.id}">Remind me</label>
    <select id="rem-${e.id}" data-remind="${e.id}">${e.loop.mode === "quiet" ? `<option value="" selected>Quiet (you skipped the card)</option>` : ""}${opts}</select>
    ${alertHTML(e)}
    <button class="btn" type="button" data-preview="${e.id}">Preview reminder</button>
    ${st === "progress" && e.confirm ? `<button class="btn primary" type="button" data-confirm="${e.id}">Simulate confirmation email</button>` : ""}
    <button class="btn" type="button" data-done="${e.id}">${st === "progress" ? "I finished it" : "Mark done"}</button>`;
  return `<div class="loopcard ${st === "closed" ? "closed" : st === "progress" ? "prog" : ""}">
    <div><h3>${e.subject}</h3><div class="sub">${e.from} · ${sub}</div></div>
    <div class="due"><b>${d ? fmtDate(d) : "—"}</b><span>${st === "closed" ? "done" : st === "progress" ? "in progress" : dueText(d)}</span></div>
    <div class="lc-actions">${actions}<button class="btn" type="button" data-open="${e.id}">Open email</button></div></div>`;
}
function loopsHTML() {
  const open = openLoops(), closed = closedLoops();
  return `<div class="trayhead"><h2>Open Loops</h2><p>Emails you opened that still need something from you. Opening a link only marks a loop as in progress. It closes when a confirmation email arrives, or when you say you're done.</p></div>
    <div class="loops">${open.length ? open.map(loopCardHTML).join("") : `<div class="panel empty">No open loops. Nice.</div>`}</div>
    ${closed.length ? `<p class="subhead">Closed</p><div class="loops">${closed.map(loopCardHTML).join("")}</div>` : ""}`;
}

// ---------------------------------------------------------------
// 5. WHAT HAPPENS WHEN YOU CLICK THINGS
// ---------------------------------------------------------------
function openEmail(id) {
  const e = byId(id);
  e.read = true;
  view = { name: "email", id, from: view.name === "email" ? view.from : view.name, acted: false };
  hideChip(); hidePush();
  render();
}
function closeLoop(e, reason) {
  if (e.loop && e.loop.status === "closed") return;
  if (!e.det.isLoop && !e.loop) return;
  e.loop = { ...(e.loop || newLoop(e)), status: "closed", reason };
  if (view.name === "email" && view.id === e.id) view.acted = true;
  toast("Loop closed: " + reason.toLowerCase());
}
function startProgress(e) {
  if (e.loop && e.loop.status !== "open") return;
  e.loop = { ...(e.loop || newLoop(e)), status: "progress", linkOn: fmtDate(TODAY) };
  toast("In progress. It closes when a confirmation email arrives.");
}
function confirmArrives(e) {
  const c = e.confirm, id = nextId++;
  const mail = { id, from: c.from, subject: c.subject, body: c.body, time: "Just now", read: false, archived: false, loop: null, confirmFor: e.id };
  mail.det = { isLoop: false, actions: [], deadline: null, link: false, score: 0 };
  emails.unshift(mail);
  closeLoop(e, "Confirmation email arrived");
  render();
}
function leaveEmail() {
  const e = byId(view.id), from = view.from || "inbox";
  const fresh = e.det.isLoop && !e.loop && !view.acted;
  view = { name: from };
  if (fresh) e.loop = newLoop(e); // opened an action email and left without acting: capture it, quietly for now
  render();
  if (fresh) showChip(e);
}

function showChip(e) {
  const d = e.det.deadline;
  const keys = d && daysLeft(d) >= 3 ? ["before2", "tonight"] : ["tonight", "tomorrow"];
  const chip = $("chip");
  chip.innerHTML = `
    <button class="x" type="button" data-chipclose aria-label="Dismiss">×</button>
    <div class="q">${d ? `Looks like this needs action by ${fmtDate(d)}. Remind you?` : "Looks like this needs action. Remind you?"}</div>
    <div class="hint">Pick a time for a push alert. If you skip this, it stays quiet: morning card only, plus one alert ${quietLabel(d)}.</div>
    <div class="opts">
      ${keys.map((k, i) => `<button class="btn ${i === 0 ? "loopy" : ""}" type="button" data-chipset="${e.id}:${k}">${reminderLabel(k, d)}</button>`).join("")}
      <button class="btn" type="button" data-chipdone="${e.id}">Already done</button>
    </div>
    <div class="timer"><i id="chiptimer"></i></div>`;
  chip.hidden = false;
  const bar = $("chiptimer");
  requestAnimationFrame(() => { bar.style.transitionDuration = "10s"; bar.style.width = "0%"; });
  clearTimeout(chipTimer);
  chipTimer = setTimeout(hideChip, 10000);
}
function hideChip() { clearTimeout(chipTimer); $("chip").hidden = true; }
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3000);
}
function previewPush(e) {
  const d = e.det.deadline, when = e.loop.mode === "loud" ? reminderLabel(e.loop.key, d) : quietLabel(d);
  const due = d ? dueText(d) + " (" + fmtDate(d) + ")" : "Still waiting on you";
  if (e.loop.status === "progress") {
    $("push").innerHTML = `<span class="src">Open Loops · ${when}</span>
      <div class="t">Did you finish this?</div>
      <div class="d">${e.subject}. You opened the link on ${e.loop.linkOn}, but no confirmation email has arrived. ${due}.</div>
      <div class="opts"><button class="btn loopy" type="button" data-pushyes="${e.id}">Yes, done</button><button class="btn" type="button" data-pushnotyet="${e.id}">Not yet</button></div>`;
  } else {
    $("push").innerHTML = `<span class="src">Open Loops · ${when}</span>
      <div class="t">${e.subject}</div>
      <div class="d">${due}. You opened this on ${e.loop.openedOn} but haven't acted on it yet.</div>
      <div class="opts"><button class="btn loopy" type="button" data-pushopen="${e.id}">Open email</button><button class="btn" type="button" data-pushignore="${e.id}">Ignore</button></div>`;
  }
  $("push").hidden = false;
}
function hidePush() { $("push").hidden = true; }

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-go],[data-open],[data-back],[data-act],[data-reply],[data-send],[data-archive],[data-done],[data-preview],[data-confirm],[data-chipset],[data-chipdone],[data-chipclose],[data-pushopen],[data-pushignore],[data-pushyes],[data-pushnotyet],#reset");
  if (!t) return;
  const d = t.dataset;
  if (t.id === "reset") { reset(); toast("Demo reset"); return; }
  if (d.go) { view = { name: d.go }; hideChip(); render(); return; }
  if (d.open) { openEmail(+d.open); return; }
  if (d.back !== undefined) { leaveEmail(); return; }
  if (d.act === "link") {
    ev.preventDefault();
    const e = byId(view.id);
    if (e.det.isLoop || e.loop) startProgress(e); else toast("Link opened (demo)");
    view.acted = true; render(); return;
  }
  if (d.reply !== undefined) { $("replybox").hidden = false; $("replytext").focus(); return; }
  if (d.send) { const e = byId(+d.send); view.acted = true; if (e.det.isLoop || e.loop) closeLoop(e, "You replied"); else toast("Reply sent (demo)"); render(); return; }
  if (d.archive) { const e = byId(+d.archive); e.archived = true; if (e.det.isLoop || e.loop) closeLoop(e, "You archived it"); else toast("Archived"); view = { name: view.from || "inbox" }; render(); return; }
  if (d.done) { closeLoop(byId(+d.done), "You said it's done"); render(); return; }
  if (d.preview) { previewPush(byId(+d.preview)); return; }
  if (d.confirm) { confirmArrives(byId(+d.confirm)); return; }
  if (d.chipset) { const [id, key] = d.chipset.split(":"); const e = byId(+id); e.loop.key = key; e.loop.mode = "loud"; hideChip(); render(); toast("Push alert set: " + reminderLabel(key, e.det.deadline)); return; }
  if (d.chipdone) { hideChip(); closeLoop(byId(+d.chipdone), "You said it's done"); render(); return; }
  if (d.chipclose !== undefined) { hideChip(); return; }
  if (d.pushopen) { hidePush(); openEmail(+d.pushopen); return; }
  if (d.pushignore) { const e = byId(+d.pushignore); e.loop.ignored++; hidePush(); render(); toast("Ignored. It moves to the top of tomorrow's morning card, with one last alert on the deadline day."); return; }
  if (d.pushyes) { hidePush(); closeLoop(byId(+d.pushyes), "You said it's done"); render(); return; }
  if (d.pushnotyet) { hidePush(); toast("Okay, still in progress. I'll check again before the deadline."); return; }
});
document.addEventListener("change", ev => {
  const s = ev.target.closest("[data-remind]");
  if (!s || !s.value) return;
  const e = byId(+s.dataset.remind);
  e.loop.key = s.value; e.loop.mode = "loud"; render();
  toast("Push alert set: " + reminderLabel(s.value, e.det.deadline));
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.matches(".row")) openEmail(+ev.target.dataset.open);
});

$("today").textContent = "Demo date: " + fmtDay(TODAY) + " 2026";
reset();
</script>

</body>
</html>
